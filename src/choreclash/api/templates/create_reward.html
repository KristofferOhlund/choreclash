{% extends "base.html" %} {% block title %} Skapa Belöning | ChoreClash {%
endblock %} {% block content %}

<div class="game-card">
  <div class="game-icon">🛡️</div>

  <h1>SKAPA BELÖNING</h1>

  <p>Skapa en ny belöning.</p>

  <form
    method="POST"
    action="{{ url_for('rewards.create') }}"
    class="game-form"
  >
    <div class="form-group">
      <label for="title"> Titel </label>

      <input
        type="text"
        id="title"
        name="title"
        class="game-input"
        required
        autocomplete="given-name"
        placeholder="Exempel: Skärmtid"
      />
    </div>

    <div class="form-group">
      <label for="description"> Beskrivning </label>

      <input
        type="text"
        id="description"
        name="description"
        class="game-input"
        required
        autocomplete="family-name"
        placeholder="Exempel: 20 min extra skärmtid"
      />
    </div>
    <div class="form-group">
      <label for="reward_type"> Typ av belöning </label>

      <select class="game-input" id="reward_type" name="reward_type">
        <option value="">--Välj--</option>
        <option value="daily">Daglig</option>
        <option value="weekly">Veckovis</option>
      </select>
    </div>

    <div class="form-group">
      <label for="icon"> Välj Ikon </label>

      <input
        type="icon"
        id="icon"
        name="icon"
        class="game-input"
        required
        autocomplete="icon"
        placeholder="Exempel: <3"
      />
    </div>

    <button type="submit" class="game-button primary">SKAPA BELÖNING</button>
  </form>
</div>

{% endblock %}
