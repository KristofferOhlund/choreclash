{% extends "base.html" %}

{% block title %}Logga in – ChoreClash{% endblock %}

{% block content %}

<div class="game-card">

<div class="game-icon">
    ⚔️
</div>

<h1>LOGGA IN</h1>

<p>
    Logga in för att se familjens uppdrag och veckans utmaningar.
</p>

<form method="POST" class="game-form">

    <div class="form-group">
        <label for="email">E-post</label>

        <input
            type="email"
            id="email"
            name="email"
            class="game-input"
            required
            autocomplete="email"
        >
    </div>

    <div class="form-group">
        <label for="password">Lösenord</label>

        <input
            type="password"
            id="password"
            name="password"
            class="game-input"
            required
            autocomplete="current-password"
        >
    </div>

    <button
        type="submit"
        class="game-button primary"
    >
        LOGGA IN
    </button>

</form>

<p>
    Har du inget konto?
    <a
        href="{{ url_for('auth.register') }}"
        class="game-link"
    >
        SKAPA KONTO
    </a>
</p>

</div>

{% endblock %}
