{% if reward %}
<dialog id="reward-modal" class="reward-modal">

    <button type="button"
            class="modal-close"
            aria-label="Stäng belöningen">
        &times;
    </button>

    <h2>Bra jobbat {{ reward['child'].first_name }} Du klarade alla sysslor!</h2>
    <p>Du har låst upp en belöning.</p>

    <img src="{{ url_for(
        'static',
        filename='images/rewards/' ~ reward.icon
    ) }}"
         alt="{{ reward['reward'].title }}">

    <h3>{{ reward['reward'].title }}</h3>
    <p>{{ reward['reward'].description }}</p>

    <form method="POST"
          action="{{ url_for('rewards.assign') }}">
        <input type="hidden"
               name="child_id"
               value="{{ reward['child'].id }}">

        <input type="hidden"
               name="reward_id"
               value="{{ reward['reward'].id }}">

        <button type="submit" class="claim-button">
            Claim
        </button>
    </form>

</dialog>
{% endif %}
