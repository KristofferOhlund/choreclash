{% extends "base.html" %}


{% block title %}
    Home | {{ parent.first_name }}
{% endblock %}

{% block content %}

    <section class="home-container">

        <h1>Välkommen, {{ parent.first_name }}!</h1>

        <p>
            Här kan du hantera dina hushållssysslor och belöningar.
        </p>

        <div class="home-actions">
            <a href="{{ url_for('auth.register') }}" class="button">
                Hantera sysslor
            </a>

            <a href="{{ url_for('auth.register') }}" class="button">
                Hantera belöningar
            </a>
        </div>

    </section>

{% endblock %}
