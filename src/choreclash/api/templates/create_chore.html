{% extends "base.html" %}

{% block title %}
Skapa Uppgift | ChoreClash
{% endblock %}

{% block content %}

<div class="game-card">

<div class="game-icon">
    🛡️
</div>

<h1>SKAPA UPPGIFT</h1>

<p>
    Skapa en ny uppgift för din familj.
</p>

<form
    method="POST"
    action="{{ url_for('chores.create') }}"
    class="game-form"
>

    <div class="form-group">
        <label for="title">
            Titel
        </label>

        <input
            type="text"
            id="title"
            name="title"
            class="game-input"
            required
            autocomplete="given-name"
            placeholder="Exempel: Städa rummet"
        >
    </div>


    <div class="form-group">
        <label for="description">
            Beskrivning
        </label>

        <input
            type="text"
            id="description"
            name="description"
            class="game-input"
            required
            autocomplete="family-name"
            placeholder="Exempel: Plocka upp leksaker och dammsug golvet"
        >
    </div>


    <div class="form-group">
        <label for="icon">
            Ikon
        </label>

        <input
            type="icon"
            id="icon"
            name="icon"
            class="game-input"
            required
            autocomplete="icon"
            placeholder="Exempel: 🧹"
        >
    </div>

    <button
        type="submit"
        class="game-button primary"
    >
        SKAPA UPPGIFT
    </button>

</form>

</div>

{% endblock %}
