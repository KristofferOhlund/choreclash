{% extends "base.html" %}

{% block title %}
Registrera | ChoreClash
{% endblock %}

{% block content %}

<div class="game-card">

<div class="game-icon">
    🛡️
</div>

<h1>REGISTRERA</h1>

<p>
    Skapa ditt konto och börja organisera familjens uppdrag.
</p>

<form
    method="POST"
    action="{{ url_for('auth.register') }}"
    class="game-form"
>

    <div class="form-group">
        <label for="first_name">
            Förnamn
        </label>

        <input
            type="text"
            id="first_name"
            name="first_name"
            class="game-input"
            required
            autocomplete="given-name"
        >
    </div>


    <div class="form-group">
        <label for="last_name">
            Efternamn
        </label>

        <input
            type="text"
            id="last_name"
            name="last_name"
            class="game-input"
            required
            autocomplete="family-name"
        >
    </div>


    <div class="form-group">
        <label for="email">
            E-post
        </label>

        <input
            type="email"
            id="email"
            name="email"
            class="game-input"
            required
            autocomplete="email"
        >
    </div>


    <div class="form-group">
        <label for="password">
            Lösenord
        </label>

        <input
            type="password"
            id="password"
            name="password"
            class="game-input"
            required
            minlength="12"
            autocomplete="new-password"
        >
    </div>


    <div class="form-group">
        <label for="confirm_password">
            Verifiera lösenord
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            class="game-input"
            required
            minlength="12"
            autocomplete="new-password"
        >
    </div>


    <button
        type="submit"
        class="game-button primary"
    >
        SKAPA KONTO
    </button>

</form>


<p>
    Redan medlem?

    <a
        href="{{ url_for('auth.login') }}"
        class="game-link"
    >
        LOGGA IN
    </a>
</p>

</div>

{% endblock %}
