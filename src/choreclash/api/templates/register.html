{% extends "base.html" %}


{% block title %}
    Logga in | ChoreClash
{% endblock %}


{% block content %}

    <section class="auth-container">

        <h1>Registrera</h1>

        <form method="POST" action="{{ url_for('auth.register') }}">

            <div>
                <label for="first_name">
                    Förnamn
                </label>

                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    required
                >
            </div>
            <div>
                <label for="last_name">
                    Efternamn
                </label>

                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    required
                >
            </div>
            <div>
                <label for="email">
                    E-post
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>

            <div>
                <label for="password">
                    Lösenord
                </label>

                <input
                    type="password"
                    id="password1"
                    name="password1"
                    required
                    min="12"
                >
            </div>

            <div>
                <label for="password">
                    Verifiera Lösenord
                </label>

                <input
                    type="password"
                    id="password2"
                    name="password2"
                    required
                    min="12"
                >
            </div>


            <button type="submit">
                Registrera
            </button>

        </form>


        <p>
            Redan medlem?

            <a href="{{ url_for('auth.login') }}">
                Logga in!
            </a>
        </p>

    </section>

{% endblock %}
